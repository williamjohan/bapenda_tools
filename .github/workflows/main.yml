name: Build Release APK

# 1. TRIGGER (KAPAN)
# Robot hanya jalan kalau Mas bikin "Release" baru di halaman GitHub
on:
  release:
    types: [published]

# 2. JOBS (TUGAS)
jobs:
  build_and_release:
    name: Build APK Release
    runs-on: ubuntu-latest

    # 3. STEPS (LANGKAH-LANGKAH)
    steps:
      # Langkah A: Ambil kodingan dari repo Mas
      - name: Checkout code
        uses: actions/checkout@v4

      # Langkah B: Siapkan Java (Android butuh Java)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Langkah C: Siapkan Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' 
          channel: 'stable'

      # Langkah D: Ambil Library (pub get)
      - name: Get Dependencies
        run: flutter pub get

      # Langkah E: CETAK ULANG Keystore dari Secrets 
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # Langkah F: BUAT FILE key.properties dari Secrets
      # Biar Gradle bisa baca passwordnya
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=../app/upload-keystore.jks" >> android/key.properties

      # Langkah G: Build APK Release
      - name: Build APK
        run: flutter build apk --release

      # Langkah H: Upload APK ke Halaman Release GitHub
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk